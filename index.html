    <style>
        :root {
            --primary-green: #4A7C59;
            --primary-orange: #F5A623;
            --primary-navy: #1F4788;
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --text-dark: #1a202c;
            --text-gray: #718096;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-light: #1a202c;
            --bg-white: #2d3748;
            --text-dark: #f7fafc;
            --text-gray: #cbd5e0;
            --border-color: #4a5568;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }

        body[data-theme="light"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 24px 30px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .title-section h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .title-section p {
            color: var(--text-gray);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
        }

        .btn-primary:hover {
            background: #3d6549;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--bg-white);
            padding: 8px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-gray);
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--bg-light);
        }

        .tab.active {
            background: var(--primary-green);
            color: white;
        }

        /* District Selector */
        .district-selector {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .district-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .district-card {
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .district-card:hover {
            border-color: var(--primary-green);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .district-card.active {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .district-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .district-status {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 24px;
            color: white;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .stat-label {
            color: var(--text-gray);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-change {
            margin-top: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-change.positive {
            color: #48bb78;
        }

        .stat-change.negative {
            color: #f56565;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        /* Map Container */
        .map-container {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            height: 600px;
        }

        .map-wrapper {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container {
            height: 100%;
            width: 100%;
        }

        /* Marker styling */
        .district-marker {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .leaflet-popup-content {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 14px;
        }

        .leaflet-popup-content b {
            color: var(--primary-green);
            font-size: 15px;
        }

        /* Cards */
        .card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        /* Chart */
        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }

        /* Alert Feed */
        .alert-item {
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid;
            transition: all 0.2s;
        }

        .alert-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow);
        }

        .alert-high {
            background: rgba(252, 129, 129, 0.1);
            border-color: #fc8181;
        }

        .alert-moderate {
            background: rgba(246, 173, 85, 0.1);
            border-color: #f6ad55;
        }

        .alert-low {
            background: rgba(104, 211, 145, 0.1);
            border-color: #68d391;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-dark);
        }

        .alert-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-high {
            background: #fc8181;
            color: white;
        }

        .badge-moderate {
            background: #f6ad55;
            color: white;
        }

        .badge-low {
            background: #68d391;
            color: white;
        }

        /* Risk Table */
        .risk-table {
            width: 100%;
            border-collapse: collapse;
        }

        .risk-table th {
            text-align: left;
            padding: 12px;
            background: var(--bg-light);
            color: var(--text-gray);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-dark);
        }

        .risk-table tr:hover {
            background: var(--bg-light);
        }

        .risk-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .risk-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .risk-fill-high {
            background: linear-gradient(90deg, #fc8181 0%, #e53e3e 100%);
        }

        .risk-fill-moderate {
            background: linear-gradient(90deg, #f6ad55 0%, #ed8936 100%);
        }

        .risk-fill-low {
            background: linear-gradient(90deg, #68d391 0%, #48bb78 100%);
        }

        /* Validation Items */
        .validation-item {
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 2px solid;
        }

        .validation-item.success {
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.1);
        }

        .validation-item.failure {
            border-color: #f56565;
            background: rgba(245, 101, 101, 0.1);
        }

        .validation-item.pending {
            border-color: #f6ad55;
            background: rgba(246, 173, 85, 0.1);
        }

        /* Footer */
        .footer {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 24px;
        }

        .footer-text {
            color: var(--text-gray);
            font-size: 14px;
        }

        .footer a {
            transition: all 0.2s ease;
        }

        .footer a:hover {
            opacity: 0.8;
            text-decoration: underline !important;
            transform: translateY(-2px);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .district-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            const [showExportModal, setShowExportModal] = useState(false);
            const chartRef = useRef(null);

            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            const currentData = districtData[selectedDistrict];

            // Theme toggle
            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
            }, [theme]);

            // Initialize map
            useEffect(() => {
                // Only initialize map when on dashboard tab and container exists
                if (activeTab === 'dashboard' && mapRef.current && !mapInstance.current) {
                    // Small delay to ensure DOM is ready
                    setTimeout(() => {
                        try {
                            mapInstance.current = L.map('map').setView([12.5, -2.0], 5);
                            
                            // Use CartoDB Positron for clean English labels
                            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                                attribution: '© OpenStreetMap contributors © CARTO',
                                subdomains: 'abcd',
                                maxZoom: 19
                            }).addTo(mapInstance.current);

                            // Add markers for all districts
                            Object.entries(districtData).forEach(([key, district]) => {
                                const highRisk = district.timeseries.filter(d => d.risk_level === 'HIGH RISK').length;
                                const color = highRisk >= 3 ? '#fc8181' : highRisk >= 1 ? '#f6ad55' : '#68d391';
                                
                                const marker = L.circleMarker(district.coordinates, {
                                    radius: 15,
                                    fillColor: color,
                                    color: 'white',
                                    weight: 3,
                                    opacity: 1,
                                    fillOpacity: 0.9,
                                    className: 'district-marker'
                                }).addTo(mapInstance.current);

                                marker.bindPopup(`
                                    <div style="min-width: 180px;">
                                        <b>${district.name}, ${district.country}</b><br>
                                        <div style="margin-top: 8px; color: #718096;">
                                            High Risk Months: <strong style="color: ${highRisk >= 3 ? '#fc8181' : highRisk >= 1 ? '#f6ad55' : '#68d391'}">${highRisk}</strong>

                                `);

                            });
                        } catch (error) {
                            console.error('Map initialization error:', error);
                        }

                    {activeTab === 'dashboard' && (
                        <>
                            {/* District Selector */}
                            <div className="district-selector">
                                <h3 style={{marginBottom: '12px'}}>Select District</h3>
                                <div className="district-grid">
                                    {Object.entries(districtData).map(([key, district]) => {
                                        const highRisk = district.timeseries.filter(d => d.risk_level === 'HIGH RISK').length;
                                        return (
                                            <div 
                                                key={key}
                                                className={`district-card ${selectedDistrict === key ? 'active' : ''}`}
                                                onClick={() => setSelectedDistrict(key)}
                                            >
                                                <div className="district-name">{district.name}, {district.country}</div>
                                                <div className="district-status">
                                                    {highRisk > 0 ? `${highRisk} High Risk Months` : 'Low Risk'}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Stats Grid */}
                            <div className="stats-grid">
                                <div className="stat-card">
                                    <div className="stat-icon" style={{background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'}}>
                                        📊
                                    </div>
                                    <div className="stat-value">
                                        {avgRiskScore}
                                        <span style={{
                                            fontSize: '16px',
                                            fontWeight: 'normal',
                                            color: '#718096',
                                            marginLeft: '8px'
                                        }}>
                                            ±6
                                        </span>
                                    </div>
                                    <div className="stat-label">Avg Risk Score</div>
                                    <div className="stat-change positive">↓ 12% vs last year</div>
                                </div>

                                <div className="stat-card">
                                    <div className="stat-icon" style={{background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'}}>
                                        🚨
                                    </div>
                                    <div className="stat-value">{highRiskMonths.length}</div>
                                    <div className="stat-label">High Risk Months</div>
                                    <div className="stat-change negative">↑ 1 vs last year</div>
                                </div>

                                <div className="stat-card">
                                    <div className="stat-icon" style={{background: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'}}>
                                        📡
                                    </div>
                                    <div className="stat-value">3</div>
                                    <div className="stat-label">Satellites Active</div>
                                    <div className="stat-change positive">100% Coverage</div>
                                </div>

                                <div className="stat-card">
                                    <div className="stat-icon" style={{background: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)'}}>
                                        ✅
                                    </div>
                                    <div className="stat-value">{validationAccuracy.toFixed(0)}%</div>
                                    <div className="stat-label">Prediction Accuracy</div>
                                    <div className="stat-change positive">Validated</div>
                                </div>
                            </div>

                            {/* Main Grid */}
                            <div className="main-grid">
                                {/* Map */}
                                <div className="map-container">
                                    <div className="card-header" style={{paddingBottom: '12px'}}>
                                        <div>
                                            <div className="card-title">Regional Risk Map</div>
                                            <div className="card-subtitle">Click markers to view district details</div>
                                        </div>
                                    </div>
                                    <div className="map-wrapper">
                                        <div id="map" ref={mapRef}></div>
                                    </div>
                                </div>

                                {/* Alert Feed */}
                                <div className="card">
                                    <div className="card-header">
                                        <div className="card-title">Risk Alerts</div>
                                    </div>
                                    
                                    {highRiskMonths.length > 0 ? (
                                        highRiskMonths.map((month, idx) => (
                                            <div key={idx} className="alert-item alert-high">
                                                <div className="alert-header">
                                                    <div className="alert-title">
                                                        {new Date(month.date).toLocaleString('default', { month: 'long' })} 2024
                                                    </div>
                                                    <span className="alert-badge badge-high">High Risk</span>
                                                </div>
                                                <div className="alert-details">
                                                    NDVI: {month.ndvi_zscore.toFixed(2)} • 
                                                    Price: {month.price} XOF • 
                                                    Score: {month.risk_score}/100
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="alert-item alert-low">
                                            <div className="alert-header">
                                                <div className="alert-title">No High Risk Alerts</div>
                                                <span className="alert-badge badge-low">All Clear</span>
                                            </div>
                                            <div className="alert-details">
                                                This district is currently in low to moderate risk status.
                                            </div>
                                        </div>
                                    )}

                                    {moderateRiskMonths.slice(0, 3).map((month, idx) => (
                                        <div key={idx} className="alert-item alert-moderate">
                                            <div className="alert-header">
                                                <div className="alert-title">
                                                    {new Date(month.date).toLocaleString('default', { month: 'long' })} 2024
                                                </div>
                                                <span className="alert-badge badge-moderate">Moderate</span>
                                            </div>
                                            <div className="alert-details">
                                                NDVI: {month.ndvi_zscore.toFixed(2)} • 
                                                Score: {month.risk_score}/100
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Chart */}
                            <div className="card" style={{marginBottom: '24px'}}>
                                <div className="card-header">
                                    <div>
                                        <div className="card-title">NDVI Anomalies vs Food Prices</div>
                                        <div className="card-subtitle">{currentData.name}, {currentData.country} • 2024</div>
                                    </div>
                                </div>
                                <div className="chart-container">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>

                            {/* Data Quality */}
                            <DataQualityPanel currentData={currentData} />

                            {/* Risk Table */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">Monthly Risk Assessment</div>
                                </div>
                                <table className="risk-table">
                                    <thead>
                                        <tr>
                                            <th>Month</th>
                                            <th>NDVI Z-Score</th>
                                            <th>Price</th>
                                            <th>Risk Score</th>
                                            <th>Status</th>
                                            <th>Source</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentData.timeseries.map((row, idx) => {
                                            const riskClass = row.risk_level.includes('HIGH') ? 'high' : 
                                                             row.risk_level.includes('MODERATE') ? 'moderate' : 'low';
                                            return (
                                                <tr key={idx}>
                                                    <td><strong>{new Date(row.date).toLocaleString('default', { month: 'short' })}</strong></td>
                                                    <td>{row.ndvi_zscore > 0 ? '+' : ''}{row.ndvi_zscore.toFixed(2)}</td>
                                                    <td>{row.price} XOF</td>
                                                    <td>
                                                        <div className="risk-bar">
                                                            <div 
                                                                className={`risk-bar-fill risk-fill-${riskClass}`}
                                                                style={{width: `${row.risk_score}%`}}
                                                            ></div>
                                                        </div>
                                                        <small>{row.risk_score}/100</small>
                                                    </td>
                                                    <td>
                                                        <span className={`alert-badge badge-${riskClass}`}>
                                                            {row.risk_level.replace(' RISK', '')}
                                                        </span>
                                                    </td>
                                                    <td><small>{row.source}</small></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </>
                    )}

                    {/* Validation Tab */}
                    {activeTab === 'validation' && (
                        <>
                            {/* District Selector */}
                            <div className="district-selector">
                                <h3 style={{marginBottom: '12px'}}>Select District for Validation History</h3>
                                <div className="district-grid">
                                    {Object.entries(districtData).map(([key, district]) => {
                                        const validations = district.validationHistory?.length || 0;
                                        return (
                                            <div 
                                                key={key}
                                                className={`district-card ${selectedDistrict === key ? 'active' : ''}`}
                                                onClick={() => setSelectedDistrict(key)}
                                            >
                                                <div className="district-name">{district.name}, {district.country}</div>
                                                <div className="district-status">
                                                    {validations} Validated Predictions
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <HistoricalAccuracy district={selectedDistrict} />
                        </>
                    )}

                    {/* Comparison Tab */}
                    {activeTab === 'comparison' && (
                        <DistrictComparison />
                    )}

                    {/* Footer */}
                    <div className="footer">
                        <div className="footer-text">
                            PHEN-RISK Validated Dashboard • Multi-Satellite Early Warning System<br/>
                            Powered by Sentinel-2, Landsat 8/9, and MODIS • Last Updated: 2024-12-31<br/>
                            Validated against FEWS NET, IPC/Cadre Harmonisé, and FAO GIEWS data
                        </div>
                        <div style={{marginTop: '16px', display: 'flex', gap: '20px', justifyContent: 'center', flexWrap: 'wrap'}}>
                            <a 
                                href="https://github.com/ecosynthralab/Phen-Risk/blob/main/README.md" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                style={{color: 'var(--primary-green)', textDecoration: 'none', fontSize: '14px', fontWeight: '600'}}
                            >
                                📖 Documentation
                            </a>
                            <a 
                                href="https://github.com/ecosynthralab/Phen-Risk/blob/main/USER_GUIDE.md" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                style={{color: 'var(--primary-green)', textDecoration: 'none', fontSize: '14px', fontWeight: '600'}}
                            >
                                📚 User Guide
                            </a>
                            <a 
                                href="https://github.com/ecosynthralab/Phen-Risk" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                style={{color: 'var(--primary-green)', textDecoration: 'none', fontSize: '14px', fontWeight: '600'}}
                            >
                                💻 GitHub Repository
                            </a>
                        </div>
                    </div>

                    {/* Export Modal */}
                    {showExportModal && (
                        <div className="modal-overlay" onClick={() => setShowExportModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h2 className="modal-title">Export Data</h2>
                                <p style={{marginBottom: '20px', color: 'var(--text-gray)'}}>
                                    Download data for {currentData.name}, {currentData.country}
                                </p>
                                
                                <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                                    <button className="btn btn-primary" onClick={exportToCSV}>
                                        📄 Export as CSV
                                    </button>
                                    <button className="btn btn-primary" onClick={exportToJSON}>
                                        📋 Export as JSON (with validation)
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => setShowExportModal(false)}>
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
